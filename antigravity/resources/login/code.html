                DivertiPlanner<span class="text-secondary-container text-2xl font-black">+</span>

<p class="font-headline-xl text-headline-xl text-on-surface mt-2 leading-[1.1]">
                ¡Bienvenido de nuevo!

<!-- Form Section -->

<!-- User Field -->

<label class="font-label-md text-label-md text-outline px-1 block" for="username">Usuario</label>
<div class="relative flex items-center bg-[#F1F5F9] rounded-xl px-4 py-4 focus-within:ring-2 ring-primary transition-all">
<span class="material-symbols-outlined text-outline mr-3">person</span>
<input class="bg-transparent border-none focus:ring-0 w-full p-0 text-on-surface placeholder:text-outline-variant font-body-md" id="username" placeholder="Tu usuario" type="text">
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-outline px-1 block" for="password">Contraseña</label>
<div class="relative flex items-center bg-[#F1F5F9] rounded-xl px-4 py-4 focus-within:ring-2 ring-primary transition-all">
<span class="material-symbols-outlined text-outline mr-3">lock</span>
<input class="bg-transparent border-none focus:ring-0 w-full p-0 text-on-surface placeholder:text-outline-variant font-body-md" id="password" type="password" value="********">
<button class="text-outline-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end">
<a class="font-label-md text-label-md text-primary-container hover:underline transition-all" href="#">¿Olvidaste tu contraseña?</a>
</div>
<!-- Sign In Button -->
<button class="bg-primary-container text-on-primary py-4 rounded-xl font-button text-button custom-shadow active:scale-95 transition-transform duration-200" type="submit">
                Iniciar Sesión
            </button>
</form>
<!-- Social Login (Disabled Section) -->
<div class="mt-auto pt-12 pb-6">
<div class="relative flex items-center justify-center mb-8">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="px-4 font-label-md text-label-md text-outline bg-background">o ingresa con</span>

</div>

<div class="fixed -top-40 -right-40 w-80 h-80 bg-secondary-container/5 rounded-full blur-[100px] pointer-events-none"></div>

<script>
        // Simple micro-interaction for password toggle
        const toggleBtn = document.querySelector('button[type="button"]');
        const passwordInput = document.getElementById('password');
        
        toggleBtn?.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleBtn.innerHTML = `<span class="material-symbols-outlined">${isPassword ? 'visibility' : 'visibility_off'}</span>`;
        });

        // Form submission prevention
        document.querySelector('form')?.addEventListener('submit', (e) => {
            e.preventDefault();
            // Just visual feedback
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = 'Cargando...';
            btn.classList.add('opacity-80');
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('opacity-80');
                alert('Funcionalidad de inicio de sesión de demostración.');
            }, 1000);
        });
    </script>
